name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    # not ubuntu-latest: that label moved to Ubuntu 26.04 in October 2026, which has no Python 3.9 build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t .

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      # the installed command, run away from the checkout, on a recorded state
      - run: |
          cd /
          magrid --version
          magrid board --replay "$GITHUB_WORKSPACE/tests/fixtures/state_20261005_1310.json.gz" --no-color
